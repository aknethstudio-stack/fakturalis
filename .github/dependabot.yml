version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    assignees:
      - "aknethstudio-stack"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      # Group major updates
      major-updates:
        patterns:
          - "*"
        update-types:
          - "major"
      # Group minor and patch updates for React ecosystem
      react-updates:
        patterns:
          - "react*"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      # Group Next.js related updates
      nextjs-updates:
        patterns:
          - "next"
          - "@next/*"
        update-types:
          - "minor"
          - "patch"
      # Group testing related updates
      testing-updates:
        patterns:
          - "jest"
          - "@jest/*"
          - "@testing-library/*"
          - "eslint*"
          - "@typescript-eslint/*"
        update-types:
          - "minor"
          - "patch"
      # Group Tailwind CSS updates
      tailwind-updates:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore Node.js engine updates (we manage via .nvmrc)
      - dependency-name: "node"
      # Ignore specific packages that need manual review
      - dependency-name: "@supabase/supabase-js"
        update-types: ["version-update:semver-major"]

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    assignees:
      - "aknethstudio-stack"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "github-actions"
      - "ci"
